# sites.motdang.net — people's own pages on Mot Dang (Nan, 2026-10-13: "sites.motdang.net/name").
# This Worker owns the sites.motdang.net custom domain. It also keeps the
# motdang.net/~* route, where the first address (2026-10-12) redirects here;
# mot-dang-site (motdang.net/*) keeps every other path on motdang.net.
name = "motdang-pages"
main = "src/worker.mjs"
compatibility_date = "2026-07-01"
workers_dev = false

# Builder, renderer, icons, map style and label glyphs. Served through the
# Worker (run_worker_first) at /~/s/…, so a route under /~ is all it needs.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

# Pages, photos, reports, quotas. Migrations:
#   npx wrangler d1 migrations apply motdang-pages --remote
[[d1_databases]]
binding = "DB"
database_name = "motdang-pages"
database_id = "aa48eb0d-bfa8-449e-9041-a2de9906a452"
migrations_dir = "migrations"

# Photos that passed the check (and held ones, served only once released).
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "motdang-pages"

# motdang.net's own Worker, for the files a page reads from it (/front/ doodler,
# /vendor/, /tiles/, /data/): a fetch to the same zone skips its Workers.
[[services]]
binding = "SITE"
service = "mot-dang-site"

[[services]]
binding = "CARDS" # the share-card library (NaNoBotCo/cards), /card/… and the builder's card preview
service = "cards"

# The Mot Dang LINE account's door for readers signed in with LINE (motdang-line, class Site in src/entry.js).
# A guest's "Remind me on LINE" on /bk/<id> hands the reminder to Site.remind; those pushes are metered there.
[[services]]
binding = "LINE_BOT"
service = "motdang-line"
entrypoint = "Site"

# Llama Guard on page text, Mistral Small on photos. Doodle anything (src/doodle.mjs) draws with FLUX.2 klein.
[ai]
binding = "AI"
remote = true

# Doodle anything: the 1024 px and 480 px WebP copies of each doodle. Without it the model's JPEG is stored as it is.
# A page asks for 5 doodles a day (Gold and the 30-day trial 30), every page together 600; vars DOODLE_FREE, DOODLE_GOLD
# and DOODLE_DAY change those numbers.
[images]
binding = "IMAGES"

# Drafts older than 30 days go; pages and photos a model failed to answer get another look.
[triggers]
crons = ["*/30 * * * *"]

[[routes]]
pattern = "sites.motdang.net"
custom_domain = true

[[routes]]
pattern = "motdang.net/~*"
zone_name = "motdang.net"

# motdang.net/tech/ — tech and AI events, live (src/events.mjs, NaN 2026-10-20)
[[routes]]
pattern = "motdang.net/tech*"
zone_name = "motdang.net"

# Gold: the year's price in baht. PROMPTPAY (her phone's PromptPay) is a secret.
[vars]
GOLD_THB = "3000"
HOTEL_THB = "555" # a month, for a page that takes room bookings (Nan 2026-10-14)
HOTEL_YEAR_THB = "5550" # the hotel year paid up front, twelve months for ten (2026-10-15)
MAIL_FROM = "Mot Dang <pages@motdang.net>"
ZONE_ID = "a9e92ea931cf4f5b085d8ce8c6a2ff15" # motdang.net, for own addresses (src/domain.mjs); on once the secret CF_SAAS_TOKEN is set
INVEST_TO = "nan@motdang.net" # an investor's note at /support goes here in full

# Secrets (npx wrangler secret put NAME), never in this file:
#   ADMIN_KEY       password for /admin (any user name)
#   SESSION_SECRET  salt for the per-connection daily counts
#   RESEND_KEY      copies of readers' messages to makers who confirmed an email
#   PROMPTPAY       the PromptPay id Gold is paid to
#   SLIPOK_KEY, SLIPOK_BRANCH   the slip check; Gold slips wait at /admin without them
#   DISCORD_SALES   webhook of the team's #minisites channel; each paid plan is posted there
#   DISCORD_PEOPLE  webhook of #people-team; each sign-up at /sell is posted there for Beer, and each volunteer at /support
#   LINE_LOGIN_ID, LINE_LOGIN_SECRET   LINE Login channel 2012126176; "Remind me on LINE" on a guest page. Callback URL to register: https://sites.motdang.net/line/cb
#   DISCORD_CORE_PLAN  webhook of #core-plan; an investor's note at /support is posted there, without the contact
# Vars (optional): NEWS_MAX people one monthly news email reaches (200), NEWS_DAY news emails all pages send in a day (600), REMIND_DAY reminder emails a day (400)
# SELLER_AUTO = "1" (a var) lets a sign-up sell at once; without it Beer says yes first
