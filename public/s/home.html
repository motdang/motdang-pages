<body>
<header class="bar">
  <a class="brand" href="/"><img src="/s/ant.svg" alt="" width="34" height="34"><span>มดแดง <small>sites</small></span></a>
  <nav class="langs" id="langs"></nav>
  <a class="mk" href="/make" data-w="make"></a>
</header>

<main id="home">
  <section class="hero night">
    <div class="sky" aria-hidden="true"><img class="fx" src="/s/home/lanterns-1100.webp" srcset="/s/home/lanterns-1100.webp 1100w, /s/home/lanterns-2000.webp 2000w" sizes="100vw" alt=""><canvas id="lanterns"></canvas></div>
    <div class="hcopy">
      <p class="kicker" data-w="kicker"></p>
      <h1 data-w="h1"></h1>
      <p class="lead" data-w="lead"></p>
      <form class="try" id="try">
        <label for="tn" data-w="tryLabel"></label>
        <div class="tryrow"><input id="tn" maxlength="60" autocomplete="off"><button class="cta" type="submit"><span data-w="tryGo"></span> →</button></div>
        <div class="chips" id="chips"></div>
      </form>
    </div>
    <figure class="stage" id="stage"><canvas id="drawn" role="img"></canvas><figcaption><i data-dingbat="pencil" data-look="mono"></i><span data-w="tapSky"></span></figcaption></figure>
  </section>

  <section class="why">
    <div class="wrap">
      <h2 data-w="whyH"></h2>
      <div class="whys">
        <div class="wy"><i data-dingbat="search" data-look="riso"></i><b data-w="why1h"></b><p data-w="why1"></p></div>
        <div class="wy"><i data-dingbat="telephone" data-look="riso"></i><b data-w="why2h"></b><p data-w="why2"></p></div>
        <div class="wy"><i data-dingbat="heart" data-look="riso"></i><b data-w="why3h"></b><p data-w="why3"></p></div>
      </div>
    </div>
  </section>

  <section class="band" style="--fx:50%;--fy:50%">
    <img class="fx" src="/s/home/path-1100.webp" srcset="/s/home/path-1100.webp 1100w, /s/home/path-2000.webp 2000w" sizes="100vw" alt="" loading="lazy" decoding="async">
    <div class="bcap rise"><p class="bk" data-w="bk"></p><h2 data-w="b_path"></h2><small class="cr" data-cr="path"></small></div>
  </section>

  <section class="pics" id="pictures">
    <div class="wrap">
      <h2 data-w="picH"></h2><p class="sub" data-w="picSub"></p>
      <div class="studio">
        <figure class="sframe"><canvas id="sdemo" role="img"></canvas><figcaption id="scap"></figcaption></figure>
        <div class="sbtns" id="sbtns"></div>
      </div>
      <div class="marks">
        <figure class="mframe"><canvas id="mdemo" role="img"></canvas></figure>
        <div><h3 data-w="mkH"></h3><p data-w="mkP"></p><button class="cta" id="mshuffle" type="button"><i data-dingbat="sparkle" data-look="mono"></i><span data-w="mkGo"></span></button></div>
      </div>
    </div>
  </section>

  <section class="phones">
    <div class="wrap"><h2 data-w="exH"></h2><p class="sub" data-w="exSub"></p></div>
    <div class="rail" id="rail"></div>
  </section>

  <section class="toys">
    <div class="wrap">
      <h2 data-w="toysH"></h2>
      <div class="grid" id="toys"></div>
    </div>
  </section>

  <section class="band" style="--fx:50%;--fy:28%">
    <img class="fx" src="/s/home/pai-1100.webp" srcset="/s/home/pai-1100.webp 1100w, /s/home/pai-2000.webp 2000w" sizes="100vw" alt="" loading="lazy" decoding="async">
    <div class="bcap rise"><p class="bk" data-w="bk"></p><h2 data-w="b_pai"></h2><small class="cr" data-cr="pai"></small></div>
  </section>

  <section class="looks">
    <div class="wrap"><h2 data-w="looksH"></h2><p class="sub" data-w="looksSub"></p></div>
    <div class="lrail" id="looks"></div>
  </section>

  <section class="band tall" style="--fx:50%;--fy:55%">
    <img class="fx" src="/s/home/wat-1100.webp" srcset="/s/home/wat-1100.webp 1100w, /s/home/wat-2000.webp 2000w" sizes="100vw" alt="" loading="lazy" decoding="async">
    <div class="bcap rise"><p class="bk" data-w="bk"></p><h2 data-w="b_wat"></h2><small class="cr" data-cr="wat"></small></div>
  </section>

  <section class="stays" id="hotels">
    <div class="wrap">
      <div class="shead"><i data-dingbat="key" data-look="paper"></i><div><h2 data-w="stayH"></h2><p data-w="staySub"></p></div></div>
      <div class="calc">
        <label><span data-w="calcNight"></span><b id="cvN"></b><input type="range" id="cN" min="300" max="10000" step="100" value="1200"></label>
        <label><span data-w="calcNights"></span><b id="cvM"></b><input type="range" id="cM" min="5" max="600" step="5" value="60"></label>
        <div class="bars">
          <div class="cbar ota"><span data-w="calcOta"></span><i id="bOta"></i><b id="vOta"></b></div>
          <div class="cbar flat"><span data-w="calcFlat"></span><i id="bFlat"></i><b id="vFlat"></b></div>
        </div>
        <p class="keep"><span data-w="calcKeep"></span> <b id="vKeep"></b></p>
        <p class="src"><span data-w="calcSrc"></span> <a href="https://zeevou.com/channels/agoda" rel="noopener">Agoda</a> · <a href="https://prenohq.com/blog/ota-commission-rates-expedia-booking-com-more/" rel="noopener">Booking.com</a></p>
        <a class="cta gold" href="/make#kind=stay" data-w="stayGo"></a>
      </div>
    </div>
  </section>

  <section class="tiers" id="gold">
    <div class="wrap">
      <h2 data-w="tiersH"></h2>
      <div class="tcards">
        <article class="tc free"><h3 data-w="freeH"></h3><p class="pr">฿0</p><ul id="freeList"></ul><a class="cta" href="/make" data-w="makeFree"></a></article>
        <article class="tc gold"><svg viewBox="0 0 120 120" class="leaf" aria-hidden="true"><g fill="#e2ac44" stroke="#120d08" stroke-width="2"><path d="M60 96C44 76 46 46 60 22 74 46 76 76 60 96z"/><path d="M60 96C44 76 46 46 60 22 74 46 76 76 60 96z" transform="rotate(-40 60 96)"/><path d="M60 96C44 76 46 46 60 22 74 46 76 76 60 96z" transform="rotate(40 60 96)"/></g></svg>
          <h3 data-w="goldH"></h3><p class="pr" id="goldPrice"></p><ul id="goldList"></ul><a class="cta gold" href="/make" data-w="makeGold"></a><p class="fine" data-w="goldFine"></p></article>
      </div>
    </div>
  </section>

  <section class="live" id="live" hidden>
    <div class="wrap"><h2 id="liveH"></h2><div class="latest" id="latest"></div><p><a class="more" href="/all" data-w="allPages"></a></p></div>
  </section>

  <section class="band" style="--fx:50%;--fy:50%">
    <img class="fx" src="/s/home/map-1100.webp" srcset="/s/home/map-1100.webp 1100w, /s/home/map-2000.webp 2000w" sizes="100vw" alt="" loading="lazy" decoding="async">
    <div class="bcap rise"><p class="bk" data-w="bk"></p><h2 data-w="b_map"></h2><small class="cr" data-cr="map"></small></div>
  </section>

  <section class="how">
    <div class="wrap">
      <h2 data-w="howH"></h2>
      <ol class="steps live3" id="steps">
        <li><b>1</b><span data-w="step1"></span><div class="opts" id="s1"></div></li>
        <li><b>2</b><span data-w="step2"></span><input id="s2" maxlength="60" autocomplete="off"><code class="addr" id="s2a"></code></li>
        <li><b>3</b><span data-w="step3"></span><div class="opts looks3" id="s3"></div></li>
      </ol>
      <a class="cta big" id="s3go" href="/make" data-w="putOnline"></a>
    </div>
  </section>
</main>
